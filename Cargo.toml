[package]
name = "tetron-messageboard"
version = "0.15.0"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
description = "Mesh-hosted message board for a tetron network -- anyone admitted to the mesh can read and post"
repository = "https://github.com/tetronos/tetron-messageboard"
authors = ["Dario", "ErikAllanKincaid"]

[[bin]]
name = "tetron-messageboard"
path = "src/main.rs"

[dependencies]
# Pinned to a tetron core release tag of this minor, not floating on main: a
# bare git dependency lets Cargo.lock freeze any commit, so suite clients
# drifted to different protocol revisions. contrib/bump-proto.sh moves the
# tag; a tetron release opens that bump as a pull request (bump-proto.yml);
# contrib/check-suite-deps.sh guards it. The wire types still use
# #[serde(default)], so binaries of the same minor keep working together.
# Used here only to read the local daemon's peer roster
# over the IPC socket (identity resolution + the network's own mesh IP to
# bind on) -- the same technique tetron-sync-receiver's roster.rs uses.
tetron-proto = { git = "https://github.com/tetronos/tetron", tag = "v0.15.5" }
# `multipart` for attachment uploads; `fs` for streaming attachment reads.
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Content-addressed attachment storage: the on-disk filename is the file's
# blake3 hash, giving free dedup. Same crate/major version tetron core uses
# (INVITE-CHECKSUM-001), no serde feature needed here.
blake3 = "1"
